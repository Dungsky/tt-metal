# TEMPORARY CI-subset (brain/sc4-subset-check): trimmed to health + 2 sanity + heterogeneous.
# Do NOT merge. Full matrix lives on ridvan/llama-het-mgd-tests @ 70b17cfb.
- name: SC4 physical discovery, health, stability, and DC validation
  cmd: "echo \"=== Physical discovery (SC4) ===\"\nmpirun --tag-output -x LD_LIBRARY_PATH -x TT_METAL_RUNTIME_ROOT\
    \ --pernode \\\n  /home/user/tt-metal/build/test/tt_metal/tt_fabric/test_physical_discovery\n\necho\
    \ \"=== System Health Check (SC4) ===\"\nmpirun --tag-output -x LD_LIBRARY_PATH -x TT_METAL_RUNTIME_ROOT\
    \ --pernode \\\n  /home/user/tt-metal/build/test/tt_metal/tt_fabric/test_system_health --min-connections\
    \ 2\n\necho \"=== Fabric stability short (SC4) ===\"\nMGD=\"${TT_METAL_HOME}/tt_metal/fabric/mesh_graph_descriptors/32x4_quad_bh_galaxy_torus_xy_graph_descriptor.textproto\"\
    \nFABRIC_BIN=\"${TT_METAL_HOME}/build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric\"\nFABRIC_CFG=\"\
    ${TT_METAL_HOME}/tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_2d_torus_stability.yaml\"\
    \nmkdir -p \"${PIPELINE_DIR}/ranklogs\" \"${TTRUN_CWD}\"\nRESOLVED_HOSTS=$(awk 'NF {printf \"%s,\"\
    , $1}' /etc/ttop/hostfile | sed 's/,$//')\ntest -f \"${TTRUN_PY}\" || { echo \"ERROR: missing ${TTRUN_PY}\"\
    ; exit 1; }\ntest -f \"${MGD}\" || { echo \"ERROR: missing ${MGD}\"; exit 1; }\ntest -x \"${FABRIC_BIN}\"\
    \ || { echo \"ERROR: missing ${FABRIC_BIN}\"; exit 1; }\ntest -f \"${FABRIC_CFG}\" || { echo \"ERROR:\
    \ missing ${FABRIC_CFG}\"; exit 1; }\n\ncd \"${TTRUN_CWD}\"\npython3 \"${TTRUN_PY}\" \\\n  --skip-executable-check\
    \ \\\n  --tcp-interface ens5f0np0 \\\n  --mesh-graph-descriptor \"${MGD}\" \\\n  --hosts \"${RESOLVED_HOSTS}\"\
    \ \\\n  --mpi-args \"--bind-to none --tag-output --wdir ${TT_METAL_HOME} --output-filename ${PIPELINE_DIR}/ranklogs\"\
    \ \\\n  \"${FABRIC_BIN}\" \\\n  --test_config \"${FABRIC_CFG}\" \\\n  --filter 'name.*_short'\n\n\
    echo \"=== DC validation (quad) neighbor exchange ===\"\ncd \"${TT_METAL_HOME}\"\nTTRUN_DIR=/etc/ttop\n\
    WORKER_HOME=/home/user/tt-metal\nmkdir -p \"${PIPELINE_DIR}\"\n\nsudo apt-get update && sudo apt-get\
    \ install -y --no-install-recommends iproute2\necho \"--- available interfaces ---\"; ip -br link\
    \ || true\n\necho \"--- ${TTRUN_DIR} ---\"\nls -la \"$TTRUN_DIR\" 2>&1 || true\nfor f in hostfile\
    \ rankfile; do\n  echo \"--- ${f} ---\"\n  cat \"${TTRUN_DIR}/${f}\" 2>&1 || true\ndone\n\ncount_hosts()\
    \ { tr ',' '\\n' <<< \"$1\" | grep -c . || true; }\n\nPIPELINE_HOSTS=$(sed -n 's/^rank[[:space:]]*[0-9]*=\\\
    ([^[:space:]]*\\).*/\\1/p' \"${TTRUN_DIR}/rankfile\" 2>/dev/null \\\n  | awk '!seen[$0]++' | paste\
    \ -sd, -)\nNHOSTS=$(count_hosts \"$PIPELINE_HOSTS\")\nif [ \"${NHOSTS:-0}\" -ne 4 ]; then\n  echo\
    \ \"rankfile yielded ${NHOSTS} host(s); falling back to hostfile order\"\n  PIPELINE_HOSTS=$(awk 'NF\
    \ {print $1}' \"${TTRUN_DIR}/hostfile\" 2>/dev/null \\\n    | awk '!seen[$0]++' | paste -sd, -)\n\
    \  NHOSTS=$(count_hosts \"$PIPELINE_HOSTS\")\nfi\necho \"Ring order (${NHOSTS} hosts): $PIPELINE_HOSTS\"\
    \nif [ \"${NHOSTS:-0}\" -ne 4 ]; then\n  echo \"::error::Could not determine the 4 quad hosts from\
    \ ${TTRUN_DIR} (see the dump above)\"\n  exit 1\nfi\n\nset -o pipefail\n./tools/scaleout/exabox/run_fabric_tests.sh\
    \ \\\n  --hosts \"$PIPELINE_HOSTS\" \\\n  --image none \\\n  --config 4x32 \\\n  --test-binary \"\
    $WORKER_HOME/build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric\" \\\n  --test-config \"$WORKER_HOME/tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_sanity_neighbor_exchange.yaml\"\
    \ \\\n  --mesh-graph-desc-path \"$WORKER_HOME/tt_metal/fabric/mesh_graph_descriptors/32x4_quad_bh_galaxy_torus_xy_graph_descriptor.textproto\"\
    \ \\\n  --filter name.2DTorusXYNeighborExchange \\\n  --mpi-if none \\\n  --mpi-args \"--wdir $WORKER_HOME\"\
    \ 2>&1 | tee \"${PIPELINE_DIR}/dc_quad_result.log\"\n\nif ! grep -qE \"Tests: [1-9][0-9]* executed\"\
    \ \"${PIPELINE_DIR}/dc_quad_result.log\"; then\n  echo \"::error::DC validation ran no tests (check\
    \ the --test-config path and --filter)\"\n  exit 1\nfi\n\nif [ -d fabric_test_logs ]; then\n  cp -a\
    \ fabric_test_logs \"${PIPELINE_DIR}/\" || true\nfi\n"
  skus:
    bh_sc4:
      timeout: 60
  owner_id: U0845EV7A5U
  team: scaleout
  budget_type: e2e
  sp_config: sc4
  release_ready: true
