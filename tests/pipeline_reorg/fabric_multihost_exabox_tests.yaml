- name: Fabric per-mesh heterogeneous-config sanity (SC4)
  cmd: "MGD=\"${TT_METAL_HOME}/tests/tt_metal/tt_fabric/custom_mesh_descriptors/llama8b_audio_4mesh_line_mesh_graph_descriptor.textproto\"\
    \nFABRIC_BIN=\"${TT_METAL_HOME}/build/test/tt_metal/tt_fabric/test_infra/test_tt_fabric\"\nFABRIC_CFG=\"\
    ${TT_METAL_HOME}/tests/tt_metal/tt_fabric/test_infra/test_yamls/test_fabric_per_mesh_heterogeneous.yaml\"\
    \nmkdir -p \"${PIPELINE_DIR}/ranklogs\" \"${TTRUN_CWD}\"\nRESOLVED_HOSTS=$(awk 'NF {printf \"%s,\"\
    , $1}' /etc/ttop/hostfile | sed 's/,$//')\ntest -f \"${TTRUN_PY}\" || { echo \"ERROR: missing ${TTRUN_PY}\"\
    ; exit 1; }\ntest -f \"${MGD}\" || { echo \"ERROR: missing ${MGD}\"; exit 1; }\ntest -x \"${FABRIC_BIN}\"\
    \ || { echo \"ERROR: missing ${FABRIC_BIN}\"; exit 1; }\ntest -f \"${FABRIC_CFG}\" || { echo \"ERROR:\
    \ missing ${FABRIC_CFG}\"; exit 1; }\n\ncd \"${TTRUN_CWD}\"\nLOG=\"${PIPELINE_DIR}/permesh_heterogeneous.log\"\
    \n# tt_run.py does NOT propagate the test binary's exit code (an mpirun SIGABRT\n# from a TT_THROW\
    \ returns 0), so assert test_tt_fabric's own success marker\n# rather than trusting the shell exit\
    \ status.\npython3 \"${TTRUN_PY}\" \\\n  --skip-executable-check \\\n  --tcp-interface ens5f0np0 \\\
    \n  --mesh-graph-descriptor \"${MGD}\" \\\n  --hosts \"${RESOLVED_HOSTS}\" \\\n  --mpi-args \"--bind-to\
    \ none --tag-output --wdir ${TT_METAL_HOME} --output-filename ${PIPELINE_DIR}/ranklogs\" \\\n  \"\
    ${FABRIC_BIN}\" \\\n  --test_config \"${FABRIC_CFG}\" \\\n  --filter 'name.HeterogeneousFabric*' 2>&1\
    \ | tee \"${LOG}\"\nif grep -qiE \"Boundary exceeded|exited on signal|caught signal|signal 6|Aborted|terminate\
    \ called|what\\(\\):|\\bFATAL\\b\" \"${LOG}\"; then\n  echo \"::error::per-mesh heterogeneous run\
    \ crashed/aborted\"; exit 1\nfi\nif grep -qE \"Tests: [0-9]+ executed, [1-9][0-9]* failed|Result:\
    \ FAILED\" \"${LOG}\"; then\n  echo \"::error::per-mesh heterogeneous run reported test failures\"\
    ; exit 1\nfi\nif ! grep -q \"All tests completed successfully\" \"${LOG}\"; then\n  echo \"::error::per-mesh\
    \ heterogeneous run did not reach the success marker (incomplete/crashed)\"; exit 1\nfi\n"
  skus:
    bh_sc4:
      timeout: 25
  owner_id: U08UBDUKH6Z
  team: scaleout
  budget_type: e2e
  sp_config: sc4
  release_ready: false
